name: Update ModSafe status

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modsafe-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python3 -m pip install --quiet Pillow

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch status from Steam + GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update

      - name: Build site (verify generator)
        env:
          SITE_URL: https://modsafe.app
        run: ./build

      - name: Commit data/games/*.json (Cloudflare Pages rebuilds on push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games data/news.json
          if git diff --staged --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: refresh modsafe status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # Optional: create a Deploy Hook in Cloudflare Pages and store URL as
      # repository secret CLOUDFLARE_PAGES_DEPLOY_HOOK to force a rebuild even
      # when status.json is unchanged.
      - name: Ping Cloudflare Deploy Hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "No CLOUDFLARE_PAGES_DEPLOY_HOOK secret; relying on git push."
          fi
