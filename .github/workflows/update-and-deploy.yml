name: Update ModSafe status

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modsafe-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: python3 -m pip install --quiet Pillow

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch status from Steam + GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./update

      # Mod lists show "Last updated on its download page"; refresh those dates
      # from the Nexus/Modrinth/Thunderstore APIs. Non-fatal: a flaky API must
      # not block the status refresh.
      - name: Refresh mod list dates
        continue-on-error: true
        run: python3 tools/verify_mods.py --write

      - name: Build site (verify generator)
        env:
          SITE_URL: https://modsafe.app
        run: ./build

      - name: Commit data/games/*.json (Cloudflare Pages rebuilds on push)
        id: commit
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games data/news.json data/mods
          if git diff --staged --quiet; then
            echo "No status changes."
          else
            git commit -m "chore: refresh modsafe status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      # Optional: create a Deploy Hook in Cloudflare Pages and store URL as
      # repository secret CLOUDFLARE_PAGES_DEPLOY_HOOK to force a rebuild even
      # when status.json is unchanged.
      - name: Ping Cloudflare Deploy Hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "No CLOUDFLARE_PAGES_DEPLOY_HOOK secret; relying on git push."
          fi

      # IndexNow: after Cloudflare deploys (script waits for the key file), submit
      # pages whose data changed in this run. No account or secret needed.
      - name: Submit changed URLs to IndexNow
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: |
          sleep 90
          python3 tools/indexnow.py --changed "${{ steps.commit.outputs.base }}" HEAD
